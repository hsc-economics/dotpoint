# Generated by tools/build_issue_template.py. Edit that script, not this file.
name: Suggest an example or statistic
description: Send a report, article, decision or statistic for Dotpoint. Every suggestion is checked before it goes on the site.
title: "Suggestion: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Use official sources where you can (RBA, ABS, ACCC, ATO, Treasury, Fair Work).
        Every fact in your summary must appear on the page you link to. The site owner reads each suggestion
        and, once approved, it is added to Dotpoint automatically.
  - type: input
    id: headline
    attributes:
      label: Headline
      description: A short, plain title, for example Unemployment edges up to 4.7%
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: ["Report", "Article", "Statistic", "Policy decision", "Speech", "Court case", "Regulation", "Research", "Trade"]
    validations:
      required: true
  - type: input
    id: source_name
    attributes:
      label: Who published it?
      description: For example ABS media release, 15 Oct 2026
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Link to the source
      placeholder: https://
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date it happened or was released
      description: Written as YYYY-MM-DD, for example 2026-10-15
    validations:
      required: true
  - type: input
    id: key_figure
    attributes:
      label: Key figure
      description: The number to remember, in under 40 characters, for example 4.7% unemployed
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What it shows, in your own words
      description: Two to four sentences, under 520 characters. Include the figures.
    validations:
      required: true
  - type: textarea
    id: use_for
    attributes:
      label: How a student could use it in an essay
    validations:
      required: true
  - type: dropdown
    id: dotpoints
    attributes:
      label: Dot points it supports
      description: Pick one or more.
      multiple: true
      options:
        - "Year 11: Business cycle (intro-business-cycle)"
        - "Year 11: Incentives (intro-incentives)"
        - "Year 11: Market structures (mkt-structures)"
        - "Year 11: Market power (mkt-power-abuse)"
        - "Year 11: Fixing market failure (mkt-gov-intervention)"
        - "Year 11: Limits of intervention (mkt-intervention-limits)"
        - "Year 11: Wages and income (hh-min-wage)"
        - "Year 11: Financial sector (fin-role)"
        - "Year 11: Superannuation (fin-super)"
        - "Year 11: Interest rates (fin-interest-rates)"
        - "Year 11: Housing affordability (fin-housing)"
        - "Year 11: Regulation (gov-regulation)"
        - "Year 11: Types of tax (gov-tax-types)"
        - "Year 11: Tax reform (gov-tax-reform)"
        - "Year 11: Australia's trade (int-trade)"
        - "Year 11: Exchange rates (int-exchange-rates)"
        - "Year 11: Balance of payments (int-bop)"
        - "Year 12: Measuring growth (iss-growth-real-gdp)"
        - "Year 12: Growth trends (iss-growth-trends)"
        - "Year 12: Terms of trade (iss-terms-of-trade)"
        - "Year 12: Participation (iss-participation)"
        - "Year 12: Unemployment (iss-unemployment-rate)"
        - "Year 12: Measuring inflation (iss-inflation-measure)"
        - "Year 12: Headline vs underlying (iss-inflation-headline-underlying)"
        - "Year 12: Causes of inflation (iss-inflation-causes)"
        - "Year 12: Sustainability (iss-environment)"
        - "Year 12: RBA objectives (mp-objectives)"
        - "Year 12: Setting the cash rate (mp-cash-rate)"
        - "Year 12: Limits of monetary policy (mp-limits)"
        - "Year 12: Budget and fiscal stance (fp-stance)"
        - "Year 12: Redistribution (fp-redistribution)"
        - "Year 12: Competition policy (micro-competition)"
        - "Year 12: Housing policy (micro-housing)"
        - "Year 12: Safety net (lm-safety-net)"
        - "Year 12: Emissions targets (env-targets)"
        - "Year 12: Protection (glb-protection)"
        - "Year 12: Trade trends (glb-trends)"
        - "Year 12: What moves the AUD (glb-aud-factors)"
        - "Year 12: Global shocks (glb-vulnerability)"
    validations:
      required: true
  - type: input
    id: quote
    attributes:
      label: A short quote copied exactly from the source
      description: One sentence or part of one, 22 words at most, word for word, without quotation marks.
    validations:
      required: true
  - type: input
    id: quote_by
    attributes:
      label: Who said or wrote the quote
      description: For example Sean Crick, ABS head of labour statistics, 1 Oct 2026
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: Every fact in my summary appears on the page I linked to.
          required: true
